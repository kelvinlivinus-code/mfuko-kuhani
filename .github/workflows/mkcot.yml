name: MKCOT build

on:
  schedule:
    - cron: "0 5 * * 1"   # kila Jumatatu: kasoro mpya za usalama zinaonekana hata bila mabadiliko
  push:
    paths: ["mkcot/**", ".github/workflows/mkcot.yml"]
  pull_request:
    paths: ["mkcot/**", ".github/workflows/mkcot.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkcot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkcot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mkcot/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Ukaguzi wa usalama: vifurushi vinavyoenda kwa kivinjari visiwe na kasoro "high" au "critical"
      - run: npm audit --omit=dev --audit-level=high
      - run: npx ng build
