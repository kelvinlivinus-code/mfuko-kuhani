name: MKCOT build

on:
  push:
    paths: ["mkcot-spring-angular/**", ".github/workflows/mkcot.yml"]
  pull_request:
    paths: ["mkcot-spring-angular/**", ".github/workflows/mkcot.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkcot-spring-angular/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkcot-spring-angular/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mkcot-spring-angular/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build
