# nginx ya frontend (kwa docker-compose.yml ya kompyuta yako). Seva ya mtandaoni inatumia deploy/ (Caddy + HTTPS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  server_tokens off;

  # Vichwa vya usalama
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # API inapelekwa kwa backend ya Spring Boot
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; }
  location = /i18n.js { add_header Cache-Control "no-cache"; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
