# nginx ya frontend (kwa docker-compose.yml ya kompyuta yako). Seva ya mtandaoni inatumia deploy/ (Caddy + HTTPS).
# Search engines na programu za AI zinazuiwa (403). Orodha hii inalingana na robots.txt.
map $http_user_agent $mkcot_bot {
  default 0;
  "~*(GPTBot|ChatGPT|OAI-SearchBot|ClaudeBot|Claude-Web|Claude-User|Claude-SearchBot|anthropic-ai|GoogleOther|Google-Extended|Googlebot|bingbot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Applebot|CCBot|PerplexityBot|Perplexity-User|Bytespider|Amazonbot|meta-externalagent|meta-externalfetcher|FacebookBot|cohere-ai|cohere-training-data-crawler|MistralAI|DuckAssistBot|Diffbot|YouBot|Omgilibot|ImagesiftBot|Timpibot|AI2Bot|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DataForSeoBot)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  server_tokens off;

  if ($mkcot_bot) { return 403; }

  # Vichwa vya usalama
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # API inapelekwa kwa backend ya MKCOT
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always; }
  location = /i18n.js { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /config.js { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
  location / { try_files $uri $uri/ /index.html; }
}
