<!doctype html>
<html lang="sw" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mfuko wa Kuhani COT</title>
<link rel="icon" href="nembo.svg" type="image/svg+xml">
<meta name="description" content="Mfumo wa kumbukumbu za Mfuko wa Kuhani COT: wanachama, michango, kuhaniwa, mikopo, miradi, vikao na hesabu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="site.js"></script>
</head>
<body>
<style>
/* Layout: e-office style — narrow icon rail + grey menu sidebar with logo card on the left, white top bar, cards on a pale ground. */
:root{
  --bg:#f8f5ec; --surface:#fffdf7; --surface-2:#f1ece0; --side:#e9e5da; --side-hi:#fffdf7; --rail:#fffdf7;
  --ink:#2c3e4c; --muted:#5f6f7c; --line:#e3ddcf; --shadow:0 1px 4px rgba(0,0,0,.16);
  --olive:#1d4f73; --on-olive:#ffffff; --sea-soft:#e4edf4; --userbtn:#1f5f8b; --badge:#e8332f;
  --acc-green:#7ddc8c; --acc-blue:#6f8db0; --acc-pink:#f39ab0;
  --brass:#a86f0c; --brass-soft:#f6ead2; --pink:#ff5a83;
  --ok:#23824a; --ok-soft:#dcf0e3; --warn:#a35f05; --warn-soft:#f8e9cf; --bad:#c23a3a; --bad-soft:#f9dfdf;
  --display:"Quicksand","Nunito","Segoe UI",Tahoma,sans-serif;
  --body:"Quicksand","Nunito","Segoe UI",Tahoma,sans-serif;
  --mono:"Quicksand","Nunito","Segoe UI",Tahoma,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#182028; --surface-2:#202a33; --side:#1c242c; --side-hi:#26313b; --rail:#151c22;
  --ink:#e2e9ef; --muted:#9aaab6; --line:#2c3843; --shadow:0 1px 4px rgba(0,0,0,.5);
  --olive:#7fb6dc; --on-olive:#0b1c29; --sea-soft:#1d3346; --userbtn:#3f86b8; --badge:#ff5a52;
  --acc-green:#6fcf7f; --acc-blue:#86a6c9; --acc-pink:#f39ab0;
  --brass:#dcaa4a; --brass-soft:#3a2d14; --pink:#ff7a9b;
  --ok:#6cc58c; --ok-soft:#173326; --warn:#e4a64c; --warn-soft:#3a2b12; --bad:#f08484; --bad-soft:#3d1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#182028; --surface-2:#202a33; --side:#1c242c; --side-hi:#26313b; --rail:#151c22;
  --ink:#e2e9ef; --muted:#9aaab6; --line:#2c3843; --shadow:0 1px 4px rgba(0,0,0,.5);
  --olive:#7fb6dc; --on-olive:#0b1c29; --sea-soft:#1d3346; --userbtn:#3f86b8; --badge:#ff5a52;
  --acc-green:#6fcf7f; --acc-blue:#86a6c9; --acc-pink:#f39ab0;
  --brass:#dcaa4a; --brass-soft:#3a2d14; --pink:#ff7a9b;
  --ok:#6cc58c; --ok-soft:#173326; --warn:#e4a64c; --warn-soft:#3a2b12; --bad:#f08484; --bad-soft:#3d1d1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--body)}
.main{background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.4rem;text-transform:uppercase;letter-spacing:.08em;word-spacing:.25em;color:var(--olive);font-weight:500}
h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.07em;word-spacing:.2em;font-weight:500;color:var(--olive)}
h3{font-size:1.08rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:64px 240px minmax(0,1fr);min-height:100vh}
.irail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px;padding-left:env(safe-area-inset-left,0px);position:sticky;top:0;height:100vh}
.irail button{all:unset;cursor:pointer;width:48px;height:52px;display:grid;place-items:center;color:var(--ink);border-bottom:2px solid transparent}
.irail button .ico{width:30px;height:30px}
.irail button[aria-current="page"]{border-bottom-color:var(--olive);color:var(--olive)}
.irail button:hover{color:var(--olive)}
.irail button:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.side{background:linear-gradient(180deg,var(--side),color-mix(in srgb,var(--side) 88%,var(--muted)));display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:22px 22px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{width:100%;max-width:196px;aspect-ratio:4/3;border-radius:12px;background:var(--side-hi);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;color:var(--olive);font:600 2.2rem var(--display);letter-spacing:.06em}
.logo{position:relative}.logo img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.brand b{font:500 1.55rem/1.15 var(--display);color:var(--olive)}
.brand .tag{font-size:.82rem;color:var(--muted)}
.brand .homepill{all:unset;cursor:pointer;width:100%;max-width:196px;padding:5px 0;border-radius:999px;background:color-mix(in srgb,var(--side-hi) 55%,transparent);font-size:1rem}
.nav{display:flex;flex-direction:column}
.nav button{all:unset;cursor:pointer;padding:12px 22px;border-top:1px solid color-mix(in srgb,var(--muted) 18%,transparent);font-size:1.02rem;font-weight:500}
.nav button:last-child{border-bottom:1px solid color-mix(in srgb,var(--muted) 18%,transparent)}
.nav button:hover{background:color-mix(in srgb,var(--side-hi) 50%,transparent)}
.nav button[aria-current="page"]{background:var(--side-hi);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--olive);outline-offset:-2px}
.side .who{margin-top:auto;padding:14px 22px;font-size:.85rem;color:var(--muted)}
.mainwrap{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 2px 6px rgba(20,40,60,.08);display:flex;align-items:stretch;justify-content:space-between;min-height:58px;padding-left:max(16px,1.5vw);padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar .t{display:flex;align-items:center;gap:12px;font-size:1.12rem;min-width:0}
.topbar .t .ico{width:28px;height:28px;color:var(--olive)}
.topbar .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .r{display:flex;align-items:stretch}
.topbar .r>*{display:flex;align-items:center;gap:8px;padding:0 16px;border-left:1px solid var(--line)}
.topbar .r button{all:unset;cursor:pointer;display:flex;align-items:center;padding:0 16px;border-left:1px solid var(--line)}
.topbar .r button .ico{width:30px;height:30px}
.topbar .r button.bell{position:relative}
.bell .badge{position:absolute;top:8px;right:8px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--badge);color:#fff;font-size:.75rem;font-weight:600;display:grid;place-items:center}
.topbar .r button:focus-visible{outline:2px solid var(--olive);outline-offset:-2px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--userbtn);color:#fff;display:grid;place-items:center;font-weight:600}
.main{padding-block:22px 40px;padding-left:max(16px,1.5vw);padding-right:max(16px,env(safe-area-inset-right,0px),1.5vw);display:flex;flex-direction:column;gap:20px;min-width:0;flex:1}
.foot{background:var(--surface-2);border-top:1px solid var(--line);text-align:center;padding-block:8px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));font-size:.9rem;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--olive);color:var(--olive)}
.btn.pri{background:var(--userbtn);border-color:var(--userbtn);color:#fff}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 12px;font-size:.88rem}
.btn:focus-visible,.cell:focus-visible,tr.click:focus-visible,.acard:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi.wi{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;align-items:center}
.kpi>.ico{grid-row:1/4;width:52px;height:52px;color:var(--ink)}
.kpi .l{font-size:1rem;color:var(--muted);font-weight:500}
.kpi .v{font:500 1.75rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:.85rem;color:var(--muted)}
.kpi.lead .v{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px dashed #cfc8b8}
.panel>h2{padding-bottom:10px;border-bottom:1px dashed var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.acard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:4px auto minmax(0,1fr) auto auto;align-items:center;column-gap:18px;padding:14px 18px 14px 0;width:100%}
.acard::before{content:"";align-self:stretch;background:var(--c,var(--olive));width:4px;margin-block:-2px}
.acard .circ{width:60px;height:60px;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.2);display:grid;place-items:center;color:var(--c,var(--olive));background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.acard .circ .ico{width:30px;height:30px}
.acard .l{color:var(--muted);font-size:1.02rem}
.acard .v{font:500 1.75rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.acard .s{font-size:.88rem;color:var(--muted)}
.acard .s.alert{color:var(--badge)}
.acard .side-n{font:500 1.5rem var(--display)}
.acard .chev{width:20px;height:20px;color:var(--muted)}
.acard:hover{border-color:var(--olive)}
.donut{display:flex;flex-direction:column;align-items:center;gap:12px}
.donut svg{width:min(100%,320px);height:auto}
.donut .ring-bg{stroke:var(--surface-2)} .donut .seg-a{stroke:var(--pink)} .donut .seg-b{stroke:var(--acc-blue)}
.donut text{fill:var(--ink);font-family:var(--display)}
.donut .sub{fill:var(--muted)}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-bottom:0}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.brass{background:var(--sea-soft);color:var(--olive)}
.empty{border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--sea-soft);color:var(--ink);border-left:4px solid var(--olive);font-size:.95rem}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:.88rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--olive);outline-offset:0;border-color:transparent}
.field .help{font-size:.82rem;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:220px;overflow:auto;padding:6px 0}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink);font-size:.95rem}
.search{min-width:min(100%,260px);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
dialog{border:0;border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,16,26,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg>header{padding:16px 20px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.dlg>header h2{color:var(--olive)}
.dlg>.body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg>footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:1.5rem;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.x:focus-visible{outline:2px solid var(--olive)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 18px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv dt{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;max-width:68ch;margin:0}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mchip{border-radius:6px;padding:6px 4px;text-align:center;font-size:.82rem;border:1px solid var(--line);display:flex;flex-direction:column}
.mchip b{font-weight:600}
.mchip.paid{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.mchip.due{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.mchip.na{opacity:.45}
.cgrid td,.cgrid th{padding:6px 6px;text-align:center}
.cgrid td:first-child,.cgrid th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.cell{all:unset;display:block;min-width:44px;padding:3px 2px;border-radius:5px;font-weight:500;font-size:.8rem;cursor:default}
.cell.paid{background:var(--ok-soft);color:var(--ok)}
.cell.due{background:var(--warn-soft);color:var(--warn)}
.cell.na{color:var(--line)}
.cell.can{cursor:pointer} .cell.can:hover{outline:1px solid var(--olive)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--olive);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--olive)}
.card .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.chart text{fill:var(--muted);font:500 11px var(--body)}
.chart .bar{fill:var(--userbtn)} .chart .exp{stroke:var(--pink);stroke-width:2;stroke-dasharray:5 4;fill:none}
.chart .grid{stroke:var(--line)}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;max-width:calc(100vw - 32px)}
.deprow{display:grid;grid-template-columns:2fr 1.3fr 1.2fr 1fr auto;gap:8px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-weight:500;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--on-olive)}
.logoprev{width:110px;height:90px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.8rem;text-align:center}
.logoprev img{width:100%;height:100%;object-fit:contain}
@media (max-width:1100px){.dash{grid-template-columns:1fr}}
.menubtn{display:none!important}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:56px minmax(0,1fr)}
  .irail{width:56px;gap:2px;padding-block:10px}
  .irail button{width:44px;height:48px}
  .irail button .ico{width:26px;height:26px}
  .menubtn{display:grid!important}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:30;width:min(280px,86vw);height:100%;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);transform:translateX(-102%);box-shadow:4px 0 24px rgba(0,0,0,.25)}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4)}
  .topbar{padding-left:12px}
  .topbar .t span{font-size:.92rem}
  .topbar .r .role{display:none}
  .topbar .r button,.topbar .r>*{padding:0 10px}
  .main{padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
  .deprow{grid-template-columns:1fr 1fr}
  .months{grid-template-columns:repeat(4,minmax(0,1fr))}
  .acard{column-gap:12px}
  .acard .circ{width:44px;height:44px}
  .kpi.wi{column-gap:12px}
  .kpi>.ico{width:40px;height:40px}
}
@media (max-width:900px) and (prefers-reduced-motion:no-preference){.side{transition:transform .2s ease}}
@media (prefers-reduced-motion:no-preference){.btn,.card,.nav button,.acard{transition:background .15s,border-color .15s}}
</style>

<div class="app">
  <nav class="irail" id="irail" aria-label="Njia za mkato"></nav>
  <aside class="side">
    <div class="brand"><div class="logo" id="logo" aria-hidden="true">JWTZ</div><div><b id="brandName">Mfuko wa Kuhani</b><div class="tag">Tawi la COT</div></div><button class="homepill" id="homepill">Mwanzo</button></div>
    <nav class="nav" id="nav" aria-label="Sehemu za mfumo"></nav>
    <div class="who" id="who">Inaunganisha…</div>
    <button class="logoutbtn" id="logoutbtn" type="button" onclick="SITE.logout()">Logout</button>

function h(tag,props,...kids){const el=document.createElement(tag);let val;
  if(props)for(const [k,v] of Object.entries(props)){if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="value")val=v;else if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2),v);
    else if(typeof v==="boolean"){el.setAttribute(k,"");if(k in el)el[k]=true;}else el.setAttribute(k,v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}
  if(val!==undefined){if(tag==="textarea")el.textContent=val;else el.value=val;}

/* ---------- finance ---------- */
function loanCalc(l){const total=(Number(l.principal)||0)*(1+(l.rate===""||l.rate==null?Number(S.settings.interestRate)||0:Number(l.rate))/100);
  const paid=(l.repayments||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);const bal=Math.max(0,total-paid);const due=addMonths(l.date,l.months);
  const status=bal<=0.5?"Umelipwa":(due&&todayISO()>due?"Umechelewa":"Unaendelea");return{total,paid,bal,due,status,monthly:l.months?total/Number(l.months):0};}
function projCalc(p){let inv=0,inc=0,exp=0;for(const e of p.entries||[]){const a=Number(e.amount)||0;if(e.kind==="mapato")inc+=a;else if(e.kind==="matumizi")exp+=a;else inv+=a;}return{inv,inc,exp,net:inc-exp-inv};}
function memberYear(m,Y){const fee=Number(S.settings.monthlyFee)||0;const paid=Array(13).fill(0);
  for(const p of S.d.payments.values())if(p.memberId===m.id&&p.type==="mwezi"&&Number(p.year)===Y)paid[Number(p.month)]+=Number(p.amount)||0;
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;const last=Y<cy?12:Y>cy?0:cm;let first=1;
  if(m.joinDate){const [jy,jm]=m.joinDate.split("-").map(Number);if(jy>Y)first=13;else if(jy===Y)first=jm;}
  const active=(m.status||"Hai")==="Hai";const dueMonths=[];for(let i=first;i<=last;i++)dueMonths.push(i);
  const total=paid.reduce((a,b)=>a+b,0);const expected=active?dueMonths.length*fee:0;
  const unpaid=active?dueMonths.filter(i=>paid[i]<=0):[];
  return{paid,total,expected,debt:Math.max(0,expected-total),unpaid,first,last,active};}
function entryPaid(mid){let s=0;for(const p of S.d.payments.values())if(p.memberId===mid&&p.type==="kiingilio")s+=Number(p.amount)||0;return s;}
function finance(Y){const inY=d=>Y==null||yearOf(d)===Y;const f={opening:Y==null?Number(S.settings.openingBalance)||0:0,kiingilio:0,mwezi:0,mengine:0,marejesho:0,mradiMapato:0,ledgerIn:0,misaada:0,mikopo:0,mradiUwekezaji:0,ledgerOut:0};
  for(const p of S.d.payments.values()){if(!inY(p.date))continue;const a=Number(p.amount)||0;if(p.type==="kiingilio")f.kiingilio+=a;else if(p.type==="mwezi")f.mwezi+=a;else f.mengine+=a;}
  for(const l of S.d.loans.values()){if(inY(l.date))f.mikopo+=Number(l.principal)||0;for(const r of l.repayments||[])if(inY(r.date))f.marejesho+=Number(r.amount)||0;}
  for(const e of S.d.events.values())if((e.status||"Imelipwa")==="Imelipwa"&&inY(e.date))f.misaada+=Number(e.amount)||0;
  for(const p of S.d.projects.values())for(const e of p.entries||[]){if(!inY(e.date))continue;const a=Number(e.amount)||0;if(e.kind==="mapato")f.mradiMapato+=a;else f.mradiUwekezaji+=a;}
  for(const x of S.d.ledger.values()){if(!inY(x.date))continue;const a=Number(x.amount)||0;if(x.dir==="in")f.ledgerIn+=a;else f.ledgerOut+=a;}
  f.in=f.opening+f.kiingilio+f.mwezi+f.mengine+f.marejesho+f.mradiMapato+f.ledgerIn;f.out=f.misaada+f.mikopo+f.mradiUwekezaji+f.ledgerOut;f.bal=f.in-f.out;return f;}
function loansOut(){let bal=0,late=0,active=0;for(const l of S.d.loans.values()){const c=loanCalc(l);bal+=c.bal;if(c.status==="Umechelewa")late++;if(c.status!=="Umelipwa")active++;}return{bal,late,active};}

function guard(){if(!S.db){toast("Hifadhidata haipatikani kwa sasa.");return false;}if(!S.canWrite){toast("Una ruhusa ya kusoma tu.");return false;}return true;}
function onWriteErr(e){const c=e&&e.code;if(c==="invalid_argument"){toast("Huna ruhusa ya kufanya hivi kwa nafasi yako. Mwombe msimamizi.");}
  else if(c==="quota_exceeded")toast("Hifadhidata imejaa. Futa kumbukumbu zisizohitajika kisha jaribu tena.");
  else if(c==="resource_exhausted")toast("Maombi mengi kwa muda mfupi. Subiri kidogo kisha jaribu tena.");
  else toast("Haikuhifadhiwa. Angalia mtandao kisha jaribu tena.");console.warn(e);}
async function save(col,id,data,quiet){if(!guard()||!canCol(col))return false;const now=new Date().toISOString();
  try{if(id){const prev=S.d[col].get(id)||{};const body={...prev,...data,updatedAt:now,updatedBy:S.uid};delete body.id;await S.db.collection(col).doc(id).set(body);}
    else await S.db.collection(col).add({...data,createdAt:now,createdBy:S.uid});
    if(!quiet)toast("Imehifadhiwa");return true;}catch(e){onWriteErr(e);return false;}}

function openForm({title,fields,values={},submit="Hifadhi",onSubmit,intro}){
  const form=h("form",{class:"fgrid",novalidate:true});const refs={};
  for(const f of fields){let ctl;const id="f_"+f.k;
    if(f.type==="deps"){ctl=depEditor(values[f.k]);refs[f.k]={read:ctl._read,wrap:ctl};form.append(ctl);continue;}
    if(f.type==="select")ctl=h("select",{id,required:f.required,value:values[f.k]??f.def??""},(f.blank?[h("option",{value:""},f.blank)]:[]),f.options.map(o=>Array.isArray(o)?h("option",{value:o[0]},o[1]):h("option",{value:o},o)));
    else if(f.type==="textarea")ctl=h("textarea",{id,placeholder:f.ph||"",value:values[f.k]??""});
    else if(f.type==="multi"||f.type==="months"){const sel=new Set((values[f.k]??f.def??[]).map(String));const opts=f.type==="months"?MONTHS_FULL.map((m,i)=>[String(i+1),m]):f.options;
      ctl=h("div",{class:"checks",id},opts.map(o=>h("label",null,h("input",{type:"checkbox",value:o[0],checked:sel.has(String(o[0]))}),o[1])));}
    else ctl=h("input",{id,type:f.type||"text",required:f.required,placeholder:f.ph||"",step:f.type==="number"?"any":null,min:f.type==="number"?"0":null,value:values[f.k]??f.def??""});
    const wrap=h("div",{class:"field"+(f.full||f.type==="textarea"||f.type==="multi"||f.type==="months"?" full":""),"data-k":f.k},
      h(f.type==="multi"||f.type==="months"?"span":"label",{class:"lab",for:id},f.label+(f.required?" *":"")),ctl,f.help?h("span",{class:"help"},f.help):null);
    refs[f.k]={ctl,wrap,f,read:()=>{if(f.type==="multi"||f.type==="months")return[...ctl.querySelectorAll("input:checked")].map(i=>f.type==="months"?Number(i.value):i.value);
      if(f.type==="number")return ctl.value===""?"":Number(ctl.value);if(f.type==="checkbox")return ctl.checked;return ctl.value.trim();}};
    form.append(wrap);}
  const readAll=()=>{const v={};for(const [k,r] of Object.entries(refs))v[k]=r.read();return v;};
  const sync=()=>{const v=readAll();for(const r of Object.values(refs))if(r.f&&r.f.show)r.wrap.hidden=!r.f.show(v);};
  form.addEventListener("input",sync);form.addEventListener("change",e=>{sync();const r=Object.values(refs).find(r=>r.ctl===e.target);if(r&&r.f.onChange)r.f.onChange(readAll(),refs);});sync();
  const err=h("p",{class:"help",style:"color:var(--bad);margin:0",role:"alert"});
  const go=async e=>{e&&e.preventDefault();const v=readAll();
    for(const r of Object.values(refs)){if(r.f&&r.f.required&&!r.wrap.hidden&&(v[r.f.k]===""||v[r.f.k]==null||(Array.isArray(v[r.f.k])&&!v[r.f.k].length))){err.textContent=`Jaza sehemu ya "${r.f.label}".`;r.ctl.focus&&r.ctl.focus();return;}}
    for(const r of Object.values(refs))if(r.f&&r.wrap.hidden)delete v[r.f.k];
    btn.disabled=true;const res=await onSubmit(v);btn.disabled=false;if(typeof res==="string"){err.textContent=res;return;}if(res!==false)closeDlg();};
  form.addEventListener("submit",go);
  const btn=h("button",{class:"btn pri",onclick:go},submit);
  openDlg(title,[intro?h("p",{class:"muted",style:"margin:0"},intro):null,form,err],[h("button",{class:"btn",onclick:closeDlg},"Ghairi"),btn]);
  setTimeout(()=>{const first=form.querySelector("input,select,textarea");first&&first.focus();},30);
  return refs;}

    fields:[{k:"no",label:"Namba ya mwanachama",required:true},{k:"rank",label:"Cheo",ph:"mf. Sajini"},{k:"name",label:"Jina kamili",required:true},
      {k:"armyNo",label:"Namba ya jeshi"},{k:"unit",label:"Kikosi / Idara"},{k:"phone",label:"Simu",type:"tel"},
      {k:"joinDate",label:"Tarehe ya kujiunga",type:"date",required:true},{k:"status",label:"Hali ya uanachama",type:"select",options:STATUS},
      {k:"usaili",label:"Usaili wa awali",type:"select",options:["Bado","Amefanyiwa"]},{k:"usailiDate",label:"Tarehe ya usaili",type:"date",show:v=>v.usaili==="Amefanyiwa"},

      {k:"notes",label:"Maelezo mengine",type:"textarea"}],
    onSubmit:async v=>{const {payEntry,entryAmount,...rest}=v;
      const dup=list("members").find(x=>x.id!==m.id&&x.no&&x.no===rest.no);if(dup)return`Namba ${rest.no} tayari inatumiwa na ${dup.name}.`;
      if(isNew){if(!guard())return false;try{const ref=await S.db.collection("members").add({...rest,createdAt:new Date().toISOString(),createdBy:S.uid});
          if(payEntry==="ndiyo"&&Number(entryAmount)>0)await save("payments",null,{memberId:ref.id,type:"kiingilio",amount:Number(entryAmount),date:rest.joinDate||todayISO(),receipt:"",note:"Ada ya kiingilio wakati wa usajili"},true);
          toast("Mwanachama amesajiliwa");S.view="mwanachama";S.sel=ref.id;render();return true;}catch(e){onWriteErr(e);return false;}}
      return save("members",m.id,rest);}});}

function paymentForm(pre={}){const Y=pre.year||S.year;
  const paidMonths=(mid,y)=>{const s=new Set();for(const p of S.d.payments.values())if(p.memberId===mid&&p.type==="mwezi"&&Number(p.year)===Number(y))s.add(Number(p.month));return s;};
  const amt=t=>t==="kiingilio"?S.settings.entryFee:t==="mwezi"?S.settings.monthlyFee:"";
  const refs=openForm({title:"Rekodi malipo",intro:"Kwa michango ya mwezi, chagua miezi yote anayolipia; kila mwezi unahifadhiwa peke yake.",
    values:{memberId:pre.memberId||"",type:pre.type||"mwezi",year:Y,months:pre.months||[],amount:pre.amount??amt(pre.type||"mwezi"),date:todayISO()},
    fields:[{k:"memberId",label:"Mwanachama",type:"select",required:true,blank:"Chagua mwanachama",options:memberOptions(false)},
      {k:"type",label:"Aina ya malipo",type:"select",options:Object.entries(PAY_TYPES),onChange:(v,r)=>{r.amount.ctl.value=amt(v.type);}},
      {k:"year",label:"Mwaka wa mchango",type:"number",show:v=>v.type==="mwezi"},
      {k:"months",label:"Miezi anayolipia",type:"months",show:v=>v.type==="mwezi",required:true},
      {k:"amount",label:"Kiasi (kwa kila mwezi kama ni mchango wa mwezi)",type:"number",required:true},
      {k:"date",label:"Tarehe ya kulipa",type:"date",required:true},{k:"receipt",label:"Namba ya risiti / muamala"},{k:"note",label:"Maelezo",full:true}],
    onSubmit:async v=>{if(!(Number(v.amount)>0))return"Weka kiasi kilicho zaidi ya sifuri.";
      if(v.type!=="mwezi")return save("payments",null,{memberId:v.memberId,type:v.type,amount:Number(v.amount),date:v.date,receipt:v.receipt,note:v.note});
      const done=paidMonths(v.memberId,v.year);const todo=v.months.filter(m=>!done.has(m));
      if(!todo.length)return"Miezi uliyochagua tayari imelipwa kwa mwanachama huyu.";
      for(const mo of todo){const ok=await save("payments",null,{memberId:v.memberId,type:"mwezi",year:Number(v.year),month:mo,amount:Number(v.amount),date:v.date,receipt:v.receipt,note:v.note},true);if(!ok)return false;}
      toast(`Michango ya miezi ${todo.length} imehifadhiwa`+(todo.length<v.months.length?" (miezi iliyolipwa awali imerukwa)":""));return true;}});
  return refs;}

function chart(Y){const fee=Number(S.settings.monthlyFee)||0;const got=Array(12).fill(0),exp=Array(12).fill(0);
  for(const p of S.d.payments.values())if(p.type==="mwezi"&&Number(p.year)===Y)got[(p.month||1)-1]+=Number(p.amount)||0;
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;

  document.getElementById("irail").replaceChildren(h("button",{class:"menubtn","aria-label":"Fungua menyu",title:"Menyu",onclick:()=>document.body.classList.toggle("menu-open")},"Menyu"));
  const hp=document.getElementById("homepill");if(!hp.onclick)hp.onclick=()=>go(homeView());
  const lg=document.getElementById("logo");const lid=S.settings.logoId;if((lid||"")!==(lg.dataset.id||"")||!lg.dataset.init){lg.dataset.init="1";lg.dataset.id=lid||"";lg.replaceChildren(h("img",{src:lid?SITE.logoUrl(lid):"nembo.svg",alt:"Nembo ya JWTZ"}));}
  document.getElementById("brandName").textContent=(S.settings.fundName||DEF.fundName).replace(/\s*-\s*COT$/,"");
  document.getElementById("topT").replaceChildren(icon("bank"),h("span",null,"Jeshi la Wananchi wa Tanzania (JWTZ) · "+((S.settings.fundName||DEF.fundName))));
  const role=!S.db?"Hifadhidata haipatikani":S.canWrite?"Mhariri":"Msomaji";
  const alerts=list("events").filter(e=>e.status==="Inasubiri").length+loansOut().late;
  const bell=h("button",{class:"bell",title:"Mambo yanayohitaji kufuatiliwa","aria-label":`Mambo ${alerts} yanahitaji kufuatiliwa`,onclick:()=>go("dashibodi")},icon("bell"),h("span",{class:"badge"},String(alerts)));
  document.getElementById("topR").replaceChildren(h("button",{title:"Taarifa za mfuko","aria-label":"Taarifa za mfuko",onclick:()=>go("taarifa")},icon("help")),bell,h("div",{class:"role"},SITE.name||SITE.email||role),langBtn());
  document.getElementById("who").textContent=!S.db?"Hifadhidata haipatikani":"Nafasi yako: "+(ROLE_LBL[SITE.role]||"—");}
let pending=0;function schedule(){if(pending)return;pending=requestAnimationFrame(()=>{pending=0;render();});}
function render(){if(S.db){if(!canView(S.view))S.view=homeView();S.canWrite=S.view!=="zangu"&&can(VIEW_COL[S.view]||"-");}renderShell();const main=document.getElementById("main");const a=document.activeElement;const fid=a&&a.id&&main.contains(a)?a.id:null;const pos=fid&&a.selectionStart!=null?a.selectionStart:null;
  const need=["members","settings"];const ready=!S.db||need.every(k=>S.loaded.has(k));
  let body;if(!ready)body=[h("div",{class:"empty"},"Inapakia taarifa za mfuko…")];else{try{body=(VIEWFN[S.view]||vDashibodi)();}catch(e){console.error(e);body=[h("div",{class:"banner"},"Sehemu hii imeshindwa kuonyeshwa. Fungua sehemu nyingine kisha urudi.")];}}
  const notes=[];if(!S.db)notes.push(h("div",{class:"banner"},"Hifadhidata ya mfuko haipatikani. Angalia mtandao kisha pakia ukurasa upya."));
  else if(SITE.role==="msomaji")notes.push(h("div",{class:"banner"},"Una nafasi ya Mkaguzi: unaona taarifa zote lakini huwezi kubadilisha chochote."));
  if(S.err)notes.push(h("div",{class:"banner"},"Muunganisho umekatika. Pakia ukurasa upya."));
  main.replaceChildren(...notes,...[body].flat(Infinity).filter(Boolean));
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(pos!=null)try{el.setSelectionRange(pos,pos);}catch(e){}}}}

document.getElementById("scrim").addEventListener("click",()=>document.body.classList.remove("menu-open"));
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWFN[v]&&v!==S.view){S.view=v;S.sel=null;render();}});
(async function start(){const hv=location.hash.slice(1);if(VIEWFN[hv]&&hv!=="mwanachama"&&hv!=="watumiaji")S.view=hv;render();
  const [db,user]=await Promise.all([claude.use("db").catch(()=>null),claude.use("user").catch(()=>null)]);S.db=db;S.user=user;
  if(SITE.role==="mwanachama"&&!VIEWS.some(v=>v[0]==="zangu"))VIEWS.unshift(["zangu","Taarifa zangu"]);
  if(SITE.role==="msimamizi"&&!VIEWS.some(v=>v[0]==="watumiaji")){VIEWS.splice(VIEWS.length-1,0,["watumiaji","Watumiaji"]);VIEW_ICON.watumiaji="users";}
  if(user){S.uid=await user.id();const ce=await user.canEdit();const cw=await user.can("data.write");S.canWrite=ce||cw===true||cw===null;}else S.canWrite=!!db;
  if(!db){render();return;}
  for(const c of COLS)db.collection(c).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,{...d.data(),id:d.id}));S.d[c]=m;S.loaded.add(c);schedule();},e=>{S.err=e.code;schedule();});
  db.doc("config/settings").onSnapshot(s=>{S.settings={...DEF,...(s.exists?s.data():{})};S.loaded.add("settings");schedule();},e=>{S.loaded.add("settings");S.err=e.code;schedule();});
  db.doc("config/about").onSnapshot(s=>{S.about=s.exists?s.data():{};S.loaded.add("about");schedule();},()=>{});
  render();})();
</script>

}

#logoutbtn:hover{background:#1f6690!important}
</style>
